name: Publish to public site repo

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to public repo
        env:
          RAW_TOKEN: ${{ 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 }}
        run: |
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          rm -rf .git .github README.md
          git init -b gh-pages
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Publish site"
          git push --force "https://x-access-token:${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}@github.com/mahan421-h/physicslab.git" gh-pages
